<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FleetCtrl</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    :root { --bg:#0a0a0b; --panel:#151517; --line:#2b2b2f; --ink:#ececed; --mut:#9b9ba1; --mut2:#64646b; --acc:#a51c22; --acc2:#c62f36; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Inter",system-ui,-apple-system,sans-serif; overflow:hidden; }
    #frame { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
    /* bouton réglages flottant (respecte l'encoche) */
    #gear { display:none !important; position:fixed; top:max(10px,env(safe-area-inset-top)); right:10px; z-index:10; width:40px; height:40px; border-radius:50%;
      background:rgba(21,21,23,.82); backdrop-filter:blur(6px); border:1px solid var(--line); color:var(--ink); font-size:17px; cursor:pointer;
      display:grid; place-items:center; box-shadow:0 6px 20px -8px rgba(0,0,0,.8); }
    #gear:active { transform:scale(.92); }
    /* splash / écran de connexion */
    #splash { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
      padding:30px calc(22px + env(safe-area-inset-right)) 30px calc(22px + env(safe-area-inset-left)); text-align:center;
      background:radial-gradient(900px 520px at 80% -10%,#17090a,transparent 58%),var(--bg); transition:opacity .3s; }
    #splash.hide { opacity:0; pointer-events:none; }
    #splash .logo { width:60px; height:60px; border-radius:14px; display:grid; place-items:center; font-size:30px; background:#141416; border:1px solid var(--line); color:var(--acc2); }
    #splash h1 { margin:6px 0 0; font-size:21px; letter-spacing:.14em; font-weight:700; } #splash h1 b { color:var(--acc2); }
    #splash .sub { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--mut2); }
    #splash .st { font-size:13px; color:var(--mut); margin-top:4px; min-height:18px; }
    /* feuille réglages */
    #sheet { position:fixed; inset:0; z-index:30; display:none; align-items:flex-end; background:rgba(0,0,0,.55); }
    #sheet.open { display:flex; }
    .sheet-card { width:100%; background:var(--panel); border-top:1px solid var(--line); border-radius:18px 18px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -20px 50px -20px #000; }
    .sheet-card h2 { margin:0 0 4px; font-size:17px; } .sheet-card p { margin:0 0 14px; font-size:12.5px; color:var(--mut2); }
    .sheet-card label { display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--mut2); margin:0 0 6px; }
    .sheet-card input { width:100%; background:#0c0c0e; border:1px solid var(--line); border-radius:9px; color:var(--ink); font-size:15px; padding:12px 13px; font-family:"JetBrains Mono",ui-monospace,monospace; }
    .presets { display:flex; flex-wrap:wrap; gap:7px; margin:11px 0 16px; }
    .preset { padding:7px 12px; border-radius:18px; border:1px solid var(--line); background:#121214; color:var(--ink); font-size:12.5px; cursor:pointer; }
    .preset:active { border-color:var(--acc2); }
    .sheet-btns { display:flex; gap:10px; }
    .sheet-btns button { flex:1; padding:14px; border-radius:11px; font-size:15px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#161618; color:var(--ink); }
    .sheet-btns .go { background:linear-gradient(135deg,var(--acc),#6d0f13); border-color:var(--acc); color:#fff; }
  </style>
</head>
<body>
  <iframe id="frame" allow="clipboard-read; clipboard-write; camera; microphone" referrerpolicy="no-referrer"></iframe>
  <button id="gear" title="serveur" aria-label="réglages serveur">⚙</button>

  <div id="splash">
    <div class="logo">⬢</div>
    <h1>FLEET<b>CTRL</b></h1>
    <div class="sub">AI Agent Command Center</div>
    <div class="st" id="splash-st">connexion au serveur…</div>
    <button id="splash-cfg" type="button" style="margin-top:6px;background:#161618;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer">⚙ Changer de serveur</button>
  </div>

  <div id="sheet">
    <div class="sheet-card">
      <h2>Serveur Fleet Office</h2>
      <p>Adresse de l'orchestrateur sur ton réseau Tailscale (VPN). Le tél doit être connecté au tailnet.</p>
      <label>URL du serveur</label>
      <input id="srv" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://fleetoffice" />
      <div class="presets" id="presets"></div>
      <div class="sheet-btns">
        <button id="cancel" type="button">Annuler</button>
        <button id="save" class="go" type="button">Connecter</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var KEY = "fleet.server";
      var DEFAULT = "http://fleetoffice";
      var PRESETS = ["http://fleetoffice", "http://100.105.204.29", "http://microservices:4173/lite"];
      var frame = document.getElementById("frame");
      var splash = document.getElementById("splash");
      var splashSt = document.getElementById("splash-st");
      var sheet = document.getElementById("sheet");
      var srv = document.getElementById("srv");

      function get() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
      function set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
      function norm(u) { u = (u || "").trim(); if (!u) return ""; if (!/^https?:\/\//i.test(u)) u = "http://" + u; return u.replace(/\/+$/, ""); }

      function load(url) {
        url = norm(url); if (!url) return openSheet();
        set(url);
        splash.classList.remove("hide"); splashSt.textContent = "connexion à " + url + " …";
        frame.src = url;
        // l'iframe met parfois du temps / échoue silencieusement : on cache le splash au onload,
        // et on propose les réglages si rien ne charge au bout de 8 s.
        clearTimeout(load._t);
        load._t = setTimeout(function () { splashSt.innerHTML = "ça traîne… vérifie le VPN ou <b>change de serveur</b> (bouton ⚙ ci-dessous)."; }, 8000);
      }
      frame.addEventListener("load", function () {
        if (!frame.src) return;
        clearTimeout(load._t);
        setTimeout(function () { splash.classList.add("hide"); }, 250);
      });

      function renderPresets() {
        var box = document.getElementById("presets"); box.innerHTML = "";
        PRESETS.forEach(function (p) {
          var b = document.createElement("button"); b.className = "preset"; b.type = "button"; b.textContent = p;
          b.onclick = function () { srv.value = p; };
          box.appendChild(b);
        });
      }
      function openSheet() { srv.value = get() || DEFAULT; renderPresets(); sheet.classList.add("open"); setTimeout(function () { srv.focus(); }, 100); }
      function closeSheet() { sheet.classList.remove("open"); }

      document.getElementById("gear").onclick = openSheet;
      document.getElementById("splash-cfg").onclick = openSheet;
      // le front distant ouvre les réglages depuis son menu (⚙ dans la sidebar) : handshake par postMessage
      window.addEventListener("message", function (e) {
        if (e.source !== frame.contentWindow || !e.data || !e.data.fleet) return;
        if (e.data.fleet === "settings") openSheet();
        if (e.data.fleet === "hello") e.source.postMessage({ fleet: "shell", v: 2 }, "*");
      });
      document.getElementById("cancel").onclick = function () { closeSheet(); if (!frame.src) splashSt.textContent = "aucun serveur configuré — appuie sur « Changer de serveur »"; };
      document.getElementById("save").onclick = function () { var u = norm(srv.value); if (!u) return; closeSheet(); load(u); };
      srv.addEventListener("keydown", function (e) { if (e.key === "Enter") document.getElementById("save").click(); });

      // boot : serveur mémorisé -> on charge ; sinon -> réglages (prérempli au défaut tailnet)
      var saved = get();
      if (saved) load(saved); else { splashSt.textContent = "premier lancement — choisis ton serveur"; openSheet(); }
    })();
  </script>
</body>
</html>
