<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1c2036">
<title>Fleet Office · Ville</title>
<style>
  html,body{margin:0;height:100%;background:#12142a;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#12142a}
  #pad{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;display:none;
    padding-bottom:env(safe-area-inset-bottom)}
  body.touch #pad{display:block}
  .btn{position:absolute;pointer-events:auto;touch-action:none;border:3px solid #1c2240;
    background:rgba(232,236,248,.28);color:#fff;font:700 20px/1 monospace;display:flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 3px rgba(127,154,208,.55);-webkit-tap-highlight-color:transparent}
  .btn.on{background:rgba(255,255,255,.55)}
  .dp{width:56px;height:56px;border-radius:8px}
  #up{left:68px;bottom:130px}#left{left:12px;bottom:74px}#right{left:124px;bottom:74px}#down{left:68px;bottom:18px}
  #a{right:22px;bottom:62px;width:84px;height:84px;border-radius:50%;font-size:34px;background:rgba(200,70,60,.45)}
  #a.on{background:rgba(255,120,100,.75)}
  .dp::after{content:"";width:0;height:0;border:9px solid transparent}
  #up::after{border-bottom:14px solid #fff;border-top:0}
  #down::after{border-top:14px solid #fff;border-bottom:0}
  #left::after{border-right:14px solid #fff;border-left:0}
  #right::after{border-left:14px solid #fff;border-right:0}
  body.land #up{bottom:100px}body.land #left{bottom:44px}body.land #right{bottom:44px}body.land #down{bottom:-12px}
  body.land #a{bottom:36px}
  #b{right:122px;bottom:30px;width:60px;height:60px;border-radius:50%;font-size:24px;background:rgba(70,110,200,.45)}
  #b.on{background:rgba(110,150,240,.8)}
  body.land #b{bottom:20px}
  #mapbtn{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));bottom:auto;width:64px;height:38px;border-radius:8px;font-size:15px;background:rgba(40,60,110,.6)}
  /* saisie du message à l'agent + panneau (Académie / Arène / session) : cadre pixel-art */
  #say{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(680px,calc(100vw - 20px));display:none;flex-direction:column;gap:6px;
    background:#fbfbff;border:4px solid #1c2240;box-shadow:inset 0 0 0 3px #7f9ad0;padding:10px 12px;font-family:KP,monospace;color:#20243a;z-index:20;box-sizing:border-box}
  #say-name{font-size:18px;letter-spacing:.5px}
  #say .row{display:flex;gap:8px}
  #say-in{flex:1;min-width:0;font:20px KP,monospace;color:#20243a;background:#eef1fb;border:3px solid #1c2240;padding:7px 9px;outline:0;border-radius:0;user-select:text;-webkit-user-select:text}
  #say-in:focus{background:#fff;border-color:#d9483a}
  #say button,#panel button{font:18px KP,monospace;color:#fff;background:#d9483a;border:3px solid #1c2240;padding:6px 12px;cursor:pointer;border-radius:0}
  #say button#say-x,#panel button{background:#4a5a8c}
  body.typing #pad{display:none}
  #panel{position:fixed;inset:0;display:none;flex-direction:column;background:#12142a;z-index:30;padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom))}
  #panel .bar{display:flex;align-items:center;gap:10px;background:#fbfbff;border:4px solid #1c2240;border-bottom:0;box-shadow:inset 0 0 0 3px #7f9ad0;padding:6px 10px;font:20px KP,monospace;color:#20243a}
  #panel-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #panel-f{flex:1;width:100%;border:4px solid #1c2240;background:#0a0a0a}
  #ov{position:fixed;inset:0;background:rgba(10,12,30,.82);display:flex;align-items:center;justify-content:center;z-index:20}
  #ov[hidden]{display:none}
  #ovf{width:min(96vw,1100px);height:min(92vh,92dvh);display:flex;flex-direction:column;background:#1c2240;
    border:4px solid #1c2240;box-shadow:0 0 0 4px #7f9ad0,0 0 0 8px #1c2240,0 10px 40px rgba(0,0,0,.6);image-rendering:pixelated}
  #ovh{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#7f9ad0;color:#fff;font:700 18px/1 KP,monospace;letter-spacing:1px}
  #ov.arena #ovh{background:#c9433f}#ov.academy #ovh{background:#3f74c4}
  #ovt{flex:1;text-shadow:2px 2px 0 #1c2240}
  #ovx{width:44px;height:36px;border:3px solid #1c2240;background:#fbfbff;color:#20243a;font:700 20px/1 monospace;cursor:pointer;box-shadow:inset -3px -3px 0 #b4bcd6;touch-action:manipulation}
  #ovi{flex:1;border:0;background:#fff;width:100%}
  pre#dbg{position:fixed;left:0;top:0;margin:0;color:#0f0;font:10px monospace;display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pad">
  <div class="btn dp" id="up"></div><div class="btn dp" id="left"></div><div class="btn dp" id="right"></div><div class="btn dp" id="down"></div>
  <div class="btn" id="a">A</div>
  <div class="btn" id="b">B</div>
  <div class="btn" id="mapbtn">MAP</div>
</div>
<div id="say"><div id="say-name"></div><div class="row"><input id="say-in" maxlength="600" autocomplete="off" enterkeyhint="send"><button id="say-go">ENVOYER</button><button id="say-x">✕</button></div></div>
<div id="panel"><div class="bar"><span id="panel-title"></span><button id="panel-x">✕ FERMER</button></div><iframe id="panel-f" referrerpolicy="no-referrer"></iframe></div>
<div id="ov" hidden><div id="ovf"><div id="ovh"><span id="ovt"></span><button id="ovx" aria-label="Fermer">✕</button></div><iframe id="ovi" title="panneau"></iframe></div></div>
<pre id="dbg" hidden></pre>
<script src="sprites.js"></script>
<script src="interior.js"></script>
<script src="town.js"></script>
<script src="world.js"></script>
</body>
</html>
